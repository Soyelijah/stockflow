<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App icons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--sf-page-bg); display:flex; gap:18px; align-items:center; flex-wrap:wrap; min-height:calc(100vh - 40px); }
  .icon-cell { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .icon-cell img { width:72px; height:72px; border-radius:18px; box-shadow: 0 8px 20px -8px rgba(15,23,42,0.35); }
  .label { font: 900 9px/1.2 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.12em; color: var(--sf-fg-3); text-align:center; }
  .sub   { font: 700 9px/1.2 var(--sf-font-sans); color: var(--sf-fg-4); text-align:center; }
  .flag { padding:10px 14px; background: #fffbeb; border:1px solid #fde68a; border-radius:12px; max-width:300px; font: 700 11px/1.4 var(--sf-font-sans); color:#92400e; }
  .flag b { display:block; font-weight:900; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:4px; color:#78350f; }
</style>
</head>
<body>
  <div class="icon-cell"><img src="../assets/icon-staff.png" alt="Sf Staff"><span class="label">Sf Staff</span><span class="sub">trabajadores</span></div>
  <div class="icon-cell"><img src="../assets/icon-client.png" alt="Sf Client"><span class="label">Sf Client</span><span class="sub">clientes</span></div>
  <div class="icon-cell"><img src="../assets/icon-driver.png" alt="Sf Driver"><span class="label">Sf Driver</span><span class="sub">repartidores</span></div>
  <div class="flag"><b>Placeholder · needs work</b>Launcher PNGs are generic 3D‑gloss "S" spheres. The real in‑product brand is the Lucide Zap on indigo‑600. Replace before shipping new APKs.</div>
</body>
</html>
