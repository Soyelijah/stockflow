<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--sf-page-bg); font-family: var(--sf-font-sans); display:grid; grid-template-columns: repeat(2, 1fr); gap:14px; align-items:start; }
  .group { display:flex; flex-direction:column; gap:8px; }
  .lbl { font: 900 9px/1.2 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.14em; color: var(--sf-fg-4); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:inherit; font-weight:900; text-transform:uppercase; letter-spacing:0.12em; font-size:11px; border-radius:12px; border:1px solid transparent; cursor:pointer; padding: 0 18px; height: 44px; }
  .btn--lg { height:56px; border-radius:16px; }
  .btn--primary { background: var(--sf-indigo-600); color:white; box-shadow: 0 4px 16px -4px rgba(79,70,229,0.3); }
  .btn--dark { background: var(--sf-slate-900); color:white; }
  .btn--secondary { background: white; color: var(--sf-fg-1); border-color: var(--sf-stroke-1); }
  .btn--ghost-danger { background: transparent; color: var(--sf-danger); }
  .btn--success-pill { background: var(--sf-warning); color:white; height:32px; padding: 0 12px; border-radius: 12px; font-size:9px; }
  .btn--disabled { background: #f1f5f9; color: var(--sf-fg-4); cursor: not-allowed; box-shadow:none; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>
  <div class="group"><span class="lbl">Primary · large · main CTA</span>
    <button class="btn btn--primary btn--lg" style="width:100%"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg> Pagar Ahora</button>
  </div>
  <div class="group"><span class="lbl">Dark · checkout block</span>
    <button class="btn btn--dark btn--lg" style="width:100%">Confirmar Arqueo y Cerrar</button>
  </div>

  <div class="group"><span class="lbl">Primary · standard</span>
    <div class="row">
      <button class="btn btn--primary">Aplicar</button>
      <button class="btn btn--primary"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Continuar</button>
    </div>
  </div>
  <div class="group"><span class="lbl">Secondary</span>
    <div class="row">
      <button class="btn btn--secondary">Cancelar</button>
      <button class="btn btn--secondary">Volver</button>
    </div>
  </div>

  <div class="group"><span class="lbl">Disabled · cannot proceed</span>
    <button class="btn btn--disabled btn--lg" disabled style="width:100%">Se requiere cliente</button>
  </div>
  <div class="group"><span class="lbl">Danger ghost · destructive</span>
    <div class="row">
      <button class="btn btn--ghost-danger">Vaciar</button>
      <button class="btn btn--ghost-danger"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m16 17 5-5-5-5M21 12H9M13 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8"/></svg> Cerrar Sesión</button>
    </div>
  </div>
</body>
</html>
