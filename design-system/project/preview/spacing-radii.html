<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--sf-page-bg); font-family: var(--sf-font-sans); }
  .grid { display:grid; grid-template-columns: repeat(6,1fr); gap:12px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width:70px; height:70px; background: white; border:1px solid var(--sf-stroke-1); box-shadow: 0 1px 3px rgba(15,23,42,0.06); }
  .box.indigo { background: var(--sf-indigo-600); border:none; }
  .lbl { font: 900 9px/1.2 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.1em; color: var(--sf-fg-2); }
  .sub { font: 700 10px/1.2 var(--sf-font-mono); color: var(--sf-fg-4); }
  .role { font: 700 9px/1.3 var(--sf-font-sans); color: var(--sf-fg-4); text-align:center; max-width:90px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="box" style="border-radius:8px"></div><span class="lbl">sm</span><span class="sub">8</span><span class="role">tags · mini swatches</span></div>
    <div class="cell"><div class="box indigo" style="border-radius:12px"></div><span class="lbl">md</span><span class="sub">12</span><span class="role">buttons · inputs · icon chips</span></div>
    <div class="cell"><div class="box" style="border-radius:16px"></div><span class="lbl">lg</span><span class="sub">16</span><span class="role">cards · product rows</span></div>
    <div class="cell"><div class="box indigo" style="border-radius:24px"></div><span class="lbl">xl</span><span class="sub">24</span><span class="role">large CTA blocks · totals</span></div>
    <div class="cell"><div class="box" style="border-radius:32px"></div><span class="lbl">2xl</span><span class="sub">32</span><span class="role">hero banners · sheets</span></div>
    <div class="cell"><div class="box indigo" style="border-radius:9999px"></div><span class="lbl">pill</span><span class="sub">∞</span><span class="role">avatars · pills · badges</span></div>
  </div>
</body>
</html>
