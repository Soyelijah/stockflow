<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Primary palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--sf-page-bg); font-family: var(--sf-font-sans); }
  h3 { margin:0 0 12px 2px; font-weight:900; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color: var(--sf-fg-4); }
  .row { display:grid; grid-template-columns: repeat(11, 1fr); gap:6px; }
  .sw { aspect-ratio: 1; border-radius:10px; display:flex; flex-direction:column; justify-content:flex-end; padding:6px; box-shadow: inset 0 0 0 1px rgba(15,23,42,0.05); }
  .sw .n { font: 900 9px/1 var(--sf-font-sans); }
  .sw .h { font: 700 8px/1 var(--sf-font-mono); margin-top:2px; opacity:.8; }
  .sw.primary { outline: 3px solid white; outline-offset: -6px; box-shadow: 0 0 0 2px var(--sf-indigo-600), inset 0 0 0 1px rgba(15,23,42,0.05); }
</style>
</head>
<body>
  <h3>Indigo · primary · #4f46e5 used everywhere</h3>
  <div class="row">
    <div class="sw" style="background:#eef2ff;color:#312e81"><span class="n">50</span><span class="h">eef2ff</span></div>
    <div class="sw" style="background:#e0e7ff;color:#312e81"><span class="n">100</span><span class="h">e0e7ff</span></div>
    <div class="sw" style="background:#c7d2fe;color:#312e81"><span class="n">200</span><span class="h">c7d2fe</span></div>
    <div class="sw" style="background:#a5b4fc;color:#312e81"><span class="n">300</span><span class="h">a5b4fc</span></div>
    <div class="sw" style="background:#818cf8;color:white"><span class="n">400</span><span class="h">818cf8</span></div>
    <div class="sw" style="background:#6366f1;color:white"><span class="n">500</span><span class="h">6366f1</span></div>
    <div class="sw primary" style="background:#4f46e5;color:white"><span class="n">600 ★</span><span class="h">4f46e5</span></div>
    <div class="sw" style="background:#4338ca;color:white"><span class="n">700</span><span class="h">4338ca</span></div>
    <div class="sw" style="background:#3730a3;color:white"><span class="n">800</span><span class="h">3730a3</span></div>
    <div class="sw" style="background:#312e81;color:white"><span class="n">900</span><span class="h">312e81</span></div>
    <div class="sw" style="background:#1e1b4b;color:white"><span class="n">950</span><span class="h">1e1b4b</span></div>
  </div>
</body>
</html>
