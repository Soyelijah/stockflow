<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--sf-page-bg); font-family: var(--sf-font-sans); display:grid; grid-template-columns: repeat(5,1fr); gap:16px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width:90px; height:60px; background: white; border-radius:14px; }
  .ic { width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-weight:900; }
  .lbl { font:900 9px/1.2 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.12em; color: var(--sf-fg-2); text-align:center; }
  .sub { font:700 9px/1.3 var(--sf-font-sans); color: var(--sf-fg-4); text-align:center; max-width:110px; }
</style>
</head>
<body>
  <div class="cell">
    <div class="box" style="box-shadow: 0 1px 2px rgba(15,23,42,0.05)"></div>
    <span class="lbl">sm</span><span class="sub">default card</span>
  </div>
  <div class="cell">
    <div class="box" style="box-shadow: 0 4px 12px rgba(15,23,42,0.08)"></div>
    <span class="lbl">md</span><span class="sub">elevated row · selected</span>
  </div>
  <div class="cell">
    <div class="ic" style="background: var(--sf-indigo-600); box-shadow: 0 8px 24px -8px rgba(79,70,229,0.45), 0 2px 6px rgba(79,70,229,0.18)">Z</div>
    <span class="lbl">indigo</span><span class="sub">brand mark · primary CTA</span>
  </div>
  <div class="cell">
    <div class="ic" style="background: #059669; box-shadow: 0 8px 24px -8px rgba(16,185,129,0.45), 0 2px 6px rgba(16,185,129,0.18)">✓</div>
    <span class="lbl">emerald</span><span class="sub">success chips</span>
  </div>
  <div class="cell">
    <div class="box" style="box-shadow: 0 25px 60px -15px rgba(0,0,0,0.55); transform: translateY(-4px)"></div>
    <span class="lbl">phone / modal</span><span class="sub">heavy lift · device frame</span>
  </div>
</body>
</html>
