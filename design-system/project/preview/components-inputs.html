<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--sf-page-bg); font-family: var(--sf-font-sans); display:grid; grid-template-columns: 1fr 1fr; gap:14px 18px; align-items:start; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .lbl { font: 900 9px/1.2 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.14em; color: var(--sf-fg-4); padding-left:4px; }
  .input { width:100%; height:48px; padding: 0 14px; background: var(--sf-slate-50); border:1px solid var(--sf-stroke-1); border-radius:12px; font: 700 12px/1 var(--sf-font-sans); color: var(--sf-fg-1); outline:none; box-sizing:border-box; }
  .input::placeholder { color: var(--sf-slate-300); }
  .input:focus { border-color: var(--sf-indigo-500); box-shadow: 0 0 0 4px rgba(79,70,229,0.1); background: white; }
  .input.focused { border-color: var(--sf-indigo-500); box-shadow: 0 0 0 4px rgba(79,70,229,0.1); background:white; }
  .wrap { position:relative; }
  .ic { position:absolute; left:14px; top:50%; transform:translateY(-50%); color: var(--sf-fg-4); pointer-events:none; }
  .pre { position:absolute; left:14px; top:50%; transform:translateY(-50%); font:900 13px/1 var(--sf-font-sans); color: var(--sf-fg-4); }
  .has-icon { padding-left:38px; }
  .has-prefix { padding-left:24px; }
  .helper { font: 700 10px/1.3 var(--sf-font-sans); color: var(--sf-fg-4); padding-left: 4px; }
  .error { color: var(--sf-danger); }
</style>
</head>
<body>
  <div class="field">
    <span class="lbl">Buscar producto</span>
    <div class="wrap">
      <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="input has-icon" placeholder="Buscar por nombre, SKU o código…">
    </div>
  </div>
  <div class="field">
    <span class="lbl">Efectivo de apertura</span>
    <div class="wrap">
      <span class="pre">$</span>
      <input class="input has-prefix focused" value="100000">
    </div>
  </div>
  <div class="field">
    <span class="lbl">Código de cupón</span>
    <input class="input" placeholder="CÓDIGO DE CUPÓN" style="font-family: var(--sf-font-mono); text-transform:uppercase; letter-spacing:0.1em;">
  </div>
  <div class="field">
    <span class="lbl">RUT del cliente</span>
    <input class="input" placeholder="12.345.678-9">
    <span class="helper error">⚠️ RUT inválido o duplicado</span>
  </div>
</body>
</html>
