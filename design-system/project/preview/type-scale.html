<!-- @dsCard group="Type" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--sf-page-bg); font-family: var(--sf-font-sans); }
  .row { display:grid; grid-template-columns: 90px 1fr; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--sf-stroke-1); gap:16px; }
  .row:last-child { border-bottom:none; }
  .spec { font: 700 10px/1.2 var(--sf-font-mono); color: var(--sf-fg-4); }
  .ex { color: var(--sf-fg-1); }
</style>
</head>
<body>
  <div class="row"><span class="spec">28 / 900</span><span class="ex" style="font-size:28px;font-weight:900;letter-spacing:-0.02em;line-height:1.05">Display · login title</span></div>
  <div class="row"><span class="spec">24 / 900</span><span class="ex" style="font-size:24px;font-weight:900;letter-spacing:-0.02em">H1 · modal heading</span></div>
  <div class="row"><span class="spec">20 / 900</span><span class="ex" style="font-size:20px;font-weight:900;letter-spacing:-0.015em">H2 · sheet · cart title</span></div>
  <div class="row"><span class="spec">16 / 900</span><span class="ex" style="font-size:16px;font-weight:900;letter-spacing:-0.01em">H3 · sub‑heading</span></div>
  <div class="row"><span class="spec">13 / 700</span><span class="ex" style="font-size:13px;font-weight:700;color:var(--sf-fg-2)">Body bold · product name in row</span></div>
  <div class="row"><span class="spec">13 / 500</span><span class="ex" style="font-size:13px;font-weight:500;color:var(--sf-fg-3)">Body · descriptive paragraph copy</span></div>
  <div class="row"><span class="spec">11 / 500</span><span class="ex" style="font-size:11px;font-weight:500;color:var(--sf-fg-3)">Caption · helper text under inputs</span></div>
</body>
</html>
