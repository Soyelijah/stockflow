<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon chips</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--sf-page-bg); font-family: var(--sf-font-sans); display:flex; flex-direction:column; gap:14px; }
  h3 { margin:0 0 4px 2px; font:900 10px/1 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.14em; color: var(--sf-fg-4); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .chip { width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center; }
  .chip svg { stroke-width:2; }
  .lg { width:52px; height:52px; border-radius:16px; }
  .sm { width:32px;height:32px;border-radius:10px; }
  .indigo { background: var(--sf-indigo-600); color:white; box-shadow: 0 8px 24px -8px rgba(79,70,229,0.45); }
  .indigo-light { background: var(--sf-indigo-50); color: var(--sf-indigo-600); }
  .emerald { background: var(--sf-success-bg); color: var(--sf-success); }
  .rose { background: var(--sf-danger-bg); color: var(--sf-danger); }
  .amber { background: var(--sf-warning-bg); color: var(--sf-warning); }
  .blue { background: var(--sf-info-bg); color: var(--sf-info); }
  .purple { background: var(--sf-customer-bg); color: var(--sf-customer); }
  .slate { background: var(--sf-slate-50); color: var(--sf-fg-3); border:1px solid var(--sf-stroke-1); }
  .lbl { font:700 10px/1.2 var(--sf-font-sans); color: var(--sf-fg-3); }
</style>
</head>
<body>
  <div>
    <h3>Primary · solid fill · tinted shadow</h3>
    <div class="row">
      <div class="chip indigo lg"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4.09 12.97a1 1 0 0 0 .77 1.63H10l-1 7.4a.5.5 0 0 0 .9.36L19.91 11.03a1 1 0 0 0-.77-1.63H14l1-7.4a.5.5 0 0 0-.9-.36L13 2z"/></svg></div>
      <div class="chip indigo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div>
      <div class="chip indigo sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
    </div>
  </div>

  <div>
    <h3>Semantic tints — bg + matching text</h3>
    <div class="row">
      <div class="chip indigo-light"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
      <div class="chip emerald"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="chip rose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
      <div class="chip amber"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h0"/></svg></div>
      <div class="chip blue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div>
      <div class="chip purple"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <div class="chip slate"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>
    </div>
  </div>
</body>
</html>
