<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slate neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--sf-page-bg); font-family: var(--sf-font-sans); }
  h3 { margin:0 0 12px 2px; font-weight:900; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color: var(--sf-fg-4); }
  .row { display:grid; grid-template-columns: repeat(11, 1fr); gap:6px; }
  .sw { aspect-ratio: 1; border-radius:10px; display:flex; flex-direction:column; justify-content:flex-end; padding:6px; box-shadow: inset 0 0 0 1px rgba(15,23,42,0.05); }
  .sw .n { font: 900 9px/1 var(--sf-font-sans); }
  .sw .h { font: 700 8px/1 var(--sf-font-mono); margin-top:2px; opacity:.8; }
  .note { display:flex; gap:14px; margin-top:14px; font:700 10px/1.4 var(--sf-font-sans); color: var(--sf-fg-3); }
  .note b { color: var(--sf-fg-2); font-weight:900; }
</style>
</head>
<body>
  <h3>Slate · neutrals · page bg #f8f9fc · text uses 400/500/800/900</h3>
  <div class="row">
    <div class="sw" style="background:#f8fafc;color:#0f172a"><span class="n">50</span><span class="h">f8fafc</span></div>
    <div class="sw" style="background:#f1f5f9;color:#0f172a"><span class="n">100</span><span class="h">f1f5f9</span></div>
    <div class="sw" style="background:#e2e8f0;color:#0f172a"><span class="n">200</span><span class="h">e2e8f0</span></div>
    <div class="sw" style="background:#cbd5e1;color:#0f172a"><span class="n">300</span><span class="h">cbd5e1</span></div>
    <div class="sw" style="background:#94a3b8;color:white"><span class="n">400</span><span class="h">94a3b8</span></div>
    <div class="sw" style="background:#64748b;color:white"><span class="n">500</span><span class="h">64748b</span></div>
    <div class="sw" style="background:#475569;color:white"><span class="n">600</span><span class="h">475569</span></div>
    <div class="sw" style="background:#334155;color:white"><span class="n">700</span><span class="h">334155</span></div>
    <div class="sw" style="background:#1e293b;color:white"><span class="n">800</span><span class="h">1e293b</span></div>
    <div class="sw" style="background:#0f172a;color:white"><span class="n">900</span><span class="h">0f172a</span></div>
    <div class="sw" style="background:#020617;color:white"><span class="n">950</span><span class="h">020617</span></div>
  </div>
  <div class="note">
    <span>Page bg <b>#f8f9fc</b> (custom, slightly off slate‑50)</span>
    <span>Card border <b>slate‑100</b></span>
    <span>Body text <b>slate‑800</b></span>
    <span>Microlabel <b>slate‑400</b></span>
  </div>
</body>
</html>
