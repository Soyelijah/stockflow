<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category pills</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--sf-page-bg); font-family: var(--sf-font-sans); }
  h3 { margin: 0 0 14px 2px; font:900 10px/1 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.14em; color: var(--sf-fg-4); }
  .scroller { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .pill { padding: 10px 18px; border-radius:12px; font:900 10px/1 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.12em; background:white; color: var(--sf-fg-3); border:1px solid var(--sf-stroke-1); flex-shrink:0; cursor:pointer; }
  .pill.active { background: var(--sf-slate-900); color:white; border-color: var(--sf-slate-900); box-shadow: 0 4px 12px rgba(15,23,42,0.15); transform: scale(1.02); }
  .row { display:flex; align-items:center; justify-content:space-between; margin-top:14px; }
  .lbl { font:900 10px/1.2 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.14em; color: var(--sf-fg-4); }
  .count { font:900 10px/1.2 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.14em; color: var(--sf-indigo-600); }
</style>
</head>
<body>
  <h3>Category slider · horizontal · selected = slate-900 fill</h3>
  <div class="scroller">
    <span class="pill active">Todos</span>
    <span class="pill">Bebidas</span>
    <span class="pill">Snacks</span>
    <span class="pill">Lácteos</span>
    <span class="pill">Panadería</span>
    <span class="pill">Despensa</span>
    <span class="pill">Limpieza</span>
    <span class="pill">Higiene</span>
  </div>
  <div class="row">
    <span class="lbl">Catálogo de Ventas</span>
    <span class="count">128 productos</span>
  </div>
</body>
</html>
