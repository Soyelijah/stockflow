<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vendor banner</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--sf-page-bg); font-family: var(--sf-font-sans); display:flex; flex-direction:column; gap:14px; }
  .banner { background: linear-gradient(to right, var(--sf-slate-900), var(--sf-indigo-950)); color:white; border-radius:32px; padding: 20px 22px; display:flex; align-items:center; justify-content:space-between; box-shadow: 0 8px 24px -8px rgba(15,23,42,0.4); }
  .left { display:flex; align-items:center; gap:14px; }
  .av { width:46px; height:46px; background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.08); border-radius:14px; display:flex; align-items:center; justify-content:center; font:900 18px/1 var(--sf-font-sans); }
  .name { font:900 14px/1.1 var(--sf-font-sans); letter-spacing:-0.01em; }
  .role { font:900 9px/1.2 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.14em; opacity:0.7; margin-top:4px; }
  .out { padding:9px; background: rgba(244,63,94,0.18); color:#fda4af; border-radius:12px; border:none; }

  .perf { background:white; border:1px solid var(--sf-stroke-1); border-radius:28px; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .pheader { display:flex; justify-content:space-between; align-items:flex-start; }
  .pt { font:900 11px/1 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.14em; color: var(--sf-fg-2); }
  .ps { font:900 9px/1.3 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.12em; color: var(--sf-fg-4); margin-top:4px; }
  .bar-row { display:flex; justify-content:space-between; align-items:baseline; font:900 9px/1.2 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.12em; color: var(--sf-fg-4); }
  .bar-row .v { color: var(--sf-indigo-600); font-variant-numeric: tabular-nums; }
  .track { height: 14px; background: var(--sf-slate-100); border-radius:9999px; padding:2px; border:1px solid var(--sf-slate-50); overflow:hidden; }
  .fill { height:100%; background: linear-gradient(to right, var(--sf-indigo-500), var(--sf-indigo-600)); border-radius:9999px; }
  .com { background:#f5f5ff; border:1px solid var(--sf-indigo-100); border-radius:16px; padding:14px; display:flex; align-items:center; justify-content:space-between; }
  .com-l { display:flex; align-items:center; gap:12px; }
  .com-ic { width:40px; height:40px; background: var(--sf-indigo-600); color:white; border-radius:12px; display:flex; align-items:center; justify-content:center; }
  .com-cap { font:900 8px/1 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.14em; color: var(--sf-fg-4); }
  .com-amt { font:900 20px/1 var(--sf-font-sans); color: var(--sf-indigo-950); letter-spacing:-0.02em; margin-top:4px; }
  .rate { font:900 9px/1 var(--sf-font-sans); color: var(--sf-indigo-600); background:white; border:1px solid var(--sf-indigo-100); padding:4px 8px; border-radius:8px; }
</style>
</head>
<body>
  <div class="banner">
    <div class="left">
      <div class="av">M</div>
      <div>
        <div class="name">María González</div>
        <div class="role">Asesor Comercial</div>
      </div>
    </div>
    <button class="out" title="Cerrar sesión"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m16 17 5-5-5-5M21 12H9M13 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8"/></svg></button>
  </div>

  <div class="perf">
    <div class="pheader">
      <div>
        <div class="pt">Rendimiento Diario</div>
        <div class="ps">Comisiones y cuotas en tiempo real</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--sf-indigo-500)" stroke-width="2.5"><path d="m23 6-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>
    </div>
    <div>
      <div class="bar-row"><span>Meta de Ventas</span><span class="v">$245.890 / $500.000</span></div>
      <div class="track" style="margin-top:6px"><div class="fill" style="width:49%"></div></div>
      <div class="bar-row" style="margin-top:6px;color:var(--sf-indigo-500)"><span>Avance Comercial</span><span>49% Completado</span></div>
    </div>
    <div class="com">
      <div class="com-l">
        <div class="com-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18M7 6h1v4M16.71 13.88l.7.71-2.82 2.82"/></svg></div>
        <div>
          <div class="com-cap">Tu Comisión Acumulada</div>
          <div class="com-amt">$6.147</div>
        </div>
      </div>
      <span class="rate">Tasa: 2.5%</span>
    </div>
  </div>
</body>
</html>
