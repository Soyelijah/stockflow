<!-- @dsCard group="Spacing" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--sf-page-bg); font-family: var(--sf-font-sans); }
  .row { display:flex; align-items:center; gap:14px; padding:7px 0; border-bottom:1px solid var(--sf-stroke-1); }
  .row:last-child { border-bottom:none; }
  .lbl { width: 60px; font: 700 10px/1.2 var(--sf-font-mono); color: var(--sf-fg-2); }
  .bar { background: var(--sf-indigo-600); height: 14px; border-radius: 3px; }
  .px { width:70px; font:700 10px/1.2 var(--sf-font-mono); color: var(--sf-fg-4); }
  .role { font: 700 11px/1.3 var(--sf-font-sans); color: var(--sf-fg-3); }
  .role b { color: var(--sf-fg-2); font-weight:900; }
</style>
</head>
<body>
  <div class="row"><span class="lbl">1</span><span class="bar" style="width:4px"></span><span class="px">4px</span><span class="role">icon gap inside pills</span></div>
  <div class="row"><span class="lbl">2</span><span class="bar" style="width:8px"></span><span class="px">8px</span><span class="role"><b>gap-x-2</b> · standard inline gap</span></div>
  <div class="row"><span class="lbl">3</span><span class="bar" style="width:12px"></span><span class="px">12px</span><span class="role">avatar to text</span></div>
  <div class="row"><span class="lbl">4</span><span class="bar" style="width:16px"></span><span class="px">16px</span><span class="role"><b>card padding</b> · `p-4`</span></div>
  <div class="row"><span class="lbl">6</span><span class="bar" style="width:24px"></span><span class="px">24px</span><span class="role"><b>page padding</b> · `p-6` · section gap</span></div>
  <div class="row"><span class="lbl">8</span><span class="bar" style="width:32px"></span><span class="px">32px</span><span class="role">desktop page padding · `p-8`</span></div>
  <div class="row"><span class="lbl">10</span><span class="bar" style="width:40px"></span><span class="px">40px</span><span class="role">bottom-nav safe area · `pb-10`</span></div>
</body>
</html>
