<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Total card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--sf-page-bg); font-family: var(--sf-font-sans); display:grid; grid-template-columns: 1fr 1fr; gap:14px; align-items:start; }
  .total { background: var(--sf-slate-900); color:white; border-radius:24px; padding:22px; display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; }
  .lbl { font:900 9px/1.2 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.14em; color: rgba(255,255,255,0.5); }
  .lbl.disc { color: #34d399; }
  .v { font:900 11px/1 var(--sf-font-sans); color: rgba(255,255,255,0.85); font-variant-numeric: tabular-nums; }
  .v.disc { color: #34d399; }
  .total-lbl { font:900 10px/1 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.14em; color: rgba(255,255,255,0.65); }
  .total-amt { font:900 26px/1 var(--sf-font-sans); letter-spacing:-0.02em; color:white; font-variant-numeric: tabular-nums; }
  .pay { width:100%; height:54px; background:white; color: var(--sf-slate-900); font:900 11px/1 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.12em; border-radius:16px; display:flex; align-items:center; justify-content:center; gap:8px; border:none; cursor:pointer; }

  .cash { background:white; border:1px solid var(--sf-stroke-1); border-radius:24px; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .ml { font:900 10px/1.2 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.14em; color: var(--sf-fg-4); }
  .est { background: #ecfdf5; border:1px solid #a7f3d0; border-radius:16px; padding:14px; display:flex; justify-content:space-between; align-items:center; }
  .est-l { color: #065f46; }
  .est .head { font:900 9px/1 var(--sf-font-sans); text-transform:uppercase; letter-spacing:0.14em; }
  .est .sub { font:700 10px/1.3 var(--sf-font-sans); color: var(--sf-fg-4); margin-top:2px; }
  .est .v { font:900 14px/1 var(--sf-font-sans); color: #065f46; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="total">
    <div class="row"><span class="lbl">Subtotal</span><span class="v">$3.780</span></div>
    <div class="row"><span class="lbl disc">Descuento (CUMPLE10)</span><span class="v disc">−$378</span></div>
    <div class="row" style="align-items:flex-end"><span class="total-lbl">Monto Total</span><span class="total-amt">$3.402</span></div>
    <button class="pay"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg> Pagar Ahora</button>
  </div>

  <div class="cash">
    <div class="ml">Arqueo por tipo de pago</div>
    <div style="display:flex;flex-direction:column;gap:6px;font:700 11px/1.4 var(--sf-font-sans);color:var(--sf-fg-3)">
      <div style="display:flex;justify-content:space-between"><span>💵 Efectivo</span><span style="color:var(--sf-fg-1);font-weight:900">$48.500</span></div>
      <div style="display:flex;justify-content:space-between"><span>💳 Tarjetas</span><span style="color:var(--sf-fg-1);font-weight:900">$112.300</span></div>
      <div style="display:flex;justify-content:space-between"><span>🔄 Transferencias</span><span style="color:var(--sf-fg-1);font-weight:900">$22.000</span></div>
      <div style="display:flex;justify-content:space-between"><span>📱 Virtual</span><span style="color:var(--sf-fg-1);font-weight:900">$8.450</span></div>
    </div>
    <div class="est">
      <div>
        <div class="head est-l">Efectivo estimado en caja</div>
        <div class="sub">Inicial + Ventas Efectivo − Retiros</div>
      </div>
      <span class="v">$148.500</span>
    </div>
  </div>
</body>
</html>
