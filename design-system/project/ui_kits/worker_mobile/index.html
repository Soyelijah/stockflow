<!doctype html>
<html lang="es" data-screen-label="StockFlow Worker Mobile Kit">
<head>
<meta charset="utf-8">
<title>StockFlow · App de Trabajadores</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1f2434; }
  body {
    font-family: Inter, system-ui, sans-serif;
    overflow: hidden;
  }
  /* Phone-frame mockup — absolute centered, JS handles scale */
  .phone {
    position: fixed; top: 50%; left: 50%;
    width: 412px; height: 892px;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    background: #060608;
    border-radius: 50px;
    padding: 12px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 30px 80px -20px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .phone::before {
    /* notch */
    content: ""; position: absolute;
    top: 16px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 28px; background: #060608; border-radius: 18px;
    z-index: 10;
  }
  .phone-screen {
    width: 100%; height: 100%;
    border-radius: 38px; overflow: hidden;
    background: var(--sf-page-bg);
    position: relative;
  }
  /* iOS-style status bar (top inside) */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 44px; padding: 0 28px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: Inter, sans-serif; font-weight: 700; font-size: 14px;
    color: var(--sf-fg-1);
    z-index: 50;
    pointer-events: none;
  }
  .status-bar.dark { color: white; }
  .status-bar .right { display: flex; align-items: center; gap: 6px; }
  .status-bar svg { display: block; }

  /* Lift entire screen content below the status bar */
  .sf-stage { padding-top: 44px; }

  /* Letterbox if window is too small (preserve aspect) — handled by .phone transform */
</style>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
    <rect width="256" height="256" fill="#4f46e5"/>
    <path d="M148 60 L80 152 H120 L108 200 L176 108 H136 L148 60 Z" fill="white"/>
  </svg>
</template>
</head>
<body>
  <div class="phone">
    <div class="phone-screen">
      <!-- Status bar overlay -->
      <div class="status-bar" id="status-bar">
        <span>22:47</span>
        <span class="right">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M.5 7.5h2v3h-2zM4.5 5.5h2v5h-2zM8.5 3.5h2v7h-2zM12.5 1.5h2v9h-2z"/></svg>
          <svg width="14" height="11" viewBox="0 0 14 11" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 5.6a9 9 0 0 1 12 0M3 7.6a6 6 0 0 1 8 0M5 9.6a3 3 0 0 1 4 0"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2.5" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="19" height="8" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg>
        </span>
      </div>

      <!-- React mount -->
      <div id="root" style="position:absolute;inset:0;"></div>
    </div>
  </div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel">
  // Scale phone to fit viewport
  const phone = document.querySelector(".phone");
  const updateScale = () => {
    const s = Math.min((window.innerHeight - 24) / 892, (window.innerWidth - 24) / 412, 1);
    phone.style.transform = `translate(-50%, -50%) scale(${s})`;
  };
  window.addEventListener("resize", updateScale);
  updateScale();

  // Status bar color follows window.__sfDark (set by React from App/Login/PaymentSheet)
  const bar = document.getElementById("status-bar");
  const syncBar = () => bar && bar.classList.toggle("dark", !!window.__sfDark);
  window.__setDark = (v) => { window.__sfDark = v; syncBar(); };
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
